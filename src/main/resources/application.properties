spring.datasource.url=jdbc:mysql://localhost:3306/finsight
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# HikariCP configuration based on Phase 5 empirical load tests
# Pool size 30 allows 4 worker threads + ~26 concurrent HTTP requests without queuing,
# preventing starvation under load while safely staying below MySQL max_connections=151.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000

# Refresh token config
refresh-token.expiration-days=7
refresh-token.hash-algorithm=SHA-256

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Login lockout config
security.lockout.max-attempts=5
security.lockout.duration-minutes=15

# Notification dispatcher config
finsight.notification.worker-pool-size=4
finsight.notification.queue-capacity=10000
finsight.notification.processing-timeout-minutes=5
finsight.notification.retry.base-delay-ms=1000
finsight.notification.retry.max-delay-ms=30000
finsight.notification.retry.max-retries=3
finsight.notification.retry.jitter-ms=500

# Actuator & Observability Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.db.enabled=true
management.metrics.enable.all=false
management.metrics.enable.hikaricp=true
management.metrics.enable.system=true
management.metrics.enable.jvm=true
management.metrics.enable.tomcat=true
management.metrics.enable.process=true
management.metrics.enable.finsight=true
